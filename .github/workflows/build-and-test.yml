name: Build and Test

on:
    push:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review

env:
    CARGO_TERM_COLOR: always
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    check_typos:
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        steps:
            - uses: actions/checkout@v6
            - name: Install minimal dependencies
              uses: awalsh128/cache-apt-pkgs-action@v1
              with:
                  packages: wget
                  version: 1.0
            - name: Spell Check Repo
              uses: crate-ci/typos@v1.31.1
              with:
                  config: ./_typos.toml

    clippy_check:
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        env:
            RUSTFLAGS: "-Dwarnings" # Make sure CI fails on all warnings, including Clippy lints
        steps:
            - uses: actions/checkout@v6
            - name: Setup dependencies
              uses: ./.github/actions/setup-deps
              with:
                  platform: linux
            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  cache-key: clippy
            - name: Install Clippy
              run: rustup component add clippy
            - name: Run Clippy
              run: cargo clippy --all-targets --all-features
            - name: Check gnark arithmetic workspace
              run: |
                  rustc --edition=2021 cli/build.rs -o "$RUNNER_TEMP/stage-templates"
                  (cd cli && OUT_DIR="$RUNNER_TEMP/gnark-templates" "$RUNNER_TEMP/stage-templates")
                  cargo clippy --manifest-path "$RUNNER_TEMP/gnark-templates/init-template/gnark-web/accelerator/Cargo.toml" --workspace --all-targets --locked -- -D warnings

    lint:
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        steps:
            - uses: actions/checkout@v6
            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  cache-key: format
            - name: Install rustfmt
              run: rustup component add rustfmt
            - name: Check formatting
              run: cargo fmt --all -- --check
            - name: Check gnark arithmetic formatting
              run: |
                  rustc --edition=2021 cli/build.rs -o "$RUNNER_TEMP/stage-templates"
                  (cd cli && OUT_DIR="$RUNNER_TEMP/gnark-templates" "$RUNNER_TEMP/stage-templates")
                  cargo fmt --manifest-path "$RUNNER_TEMP/gnark-templates/init-template/gnark-web/accelerator/Cargo.toml" --all -- --check

    cli_build:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        needs: [lint, clippy_check, check_typos]
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        steps:
            - uses: actions/checkout@v6

            - name: Install Rust components
              run: |
                  rustup show
                  rustup component add clippy rustfmt

            - name: Build & install CLI
              run: |
                  cd cli
                  cargo install --path . --locked
                  ~/.cargo/bin/mopro --help
                  ~/.cargo/bin/mopro --version || true

            - name: Test CLI scaffolding
              run: cargo test -p mopro-cli --locked

            - name: Check CLI crate contents
              run: |
                  cargo package -p mopro-cli --list --locked > "$RUNNER_TEMP/mopro-cli-files.txt"
                  python3 - <<'PYCODE'
                  import os
                  from pathlib import Path
                  files = set((Path(os.environ["RUNNER_TEMP"]) / "mopro-cli-files.txt").read_text().splitlines())
                  for name in ["build.rs", "template_stage.rs",
                      "src/template/init/gnark-web/accelerator/Cargo.toml.template",
                      "src/template/init/gnark-web/accelerator/Cargo.lock",
                      "src/template/init/gnark-web/accelerator/src/lib.rs",
                      "src/template/init/gnark-web/accelerator/ark-bn254/Cargo.toml.template",
                      "src/template/init/gnark-web/accelerator/ark-bn254/src/lib.rs"]:
                      assert name in files, f"CLI crate omits {name}"
                  assert not any("/target/" in name or "/node_modules/" in name for name in files)
                  PYCODE

            - name: Upload CLI binary (${{ runner.os }})
              uses: actions/upload-artifact@v6
              with:
                  name: mopro-bin-${{ runner.os }}
                  path: ~/.cargo/bin/mopro
                  if-no-files-found: error

    cli_template_tests:
        needs: cli_build
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest]
                adapter: [circom, halo2, noir, gnark, none]
        runs-on: ${{ matrix.os }}
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        steps:
            - uses: actions/checkout@v6

            - name: Setup Go (for gnark adapter)
              if: matrix.adapter == 'gnark'
              uses: actions/setup-go@v5
              with:
                  go-version: "1.24"

            - name: Prepare template project
              uses: ./.github/actions/mopro-init-project
              with:
                  artifact-name: mopro-bin-${{ runner.os }}
                  adapter: ${{ matrix.adapter }}
                  project-name: mopro-example-${{ matrix.adapter }}
                  destination: ${{ runner.temp }}

            - name: Install Kotlin 1.9.24
              run: |
                  curl -fL https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip -o kotlin.zip
                  unzip -q kotlin.zip -d "$HOME"
                  echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"

            - name: Run tests with JNA
              working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}
              run: |
                  curl -L https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.13.0/jna-5.13.0.jar -o jna-5.13.0.jar
                  export CLASSPATH="$PWD/jna-5.13.0.jar"
                  cargo test --all --all-features

            - name: Build with the rapidsnark feature
              if: matrix.adapter == 'circom'
              working-directory: ${{ runner.temp }}/mopro-example-circom
              run: |
                  sed -i.bak 's/^circom-prover = "0.1"$/circom-prover = { version = "0.1", features = ["rapidsnark"] }/' Cargo.toml
                  rm Cargo.toml.bak
                  grep -q 'features = \["rapidsnark"\]' Cargo.toml || {
                      echo "::error::failed to enable the rapidsnark feature; the circom-prover entry in cli/src/init/circom.rs may have changed"
                      exit 1
                  }
                  cargo build

    cli_build_ios_prepare:
        needs: cli_build
        strategy:
            fail-fast: false
            matrix:
                adapter: [circom, halo2, noir, gnark]
        runs-on: macos-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        steps:
            - uses: actions/checkout@v6

            - name: Setup Go (for gnark adapter)
              if: matrix.adapter == 'gnark'
              uses: actions/setup-go@v5
              with:
                  go-version: "1.24"

            - name: Prepare template project
              uses: ./.github/actions/mopro-init-project
              with:
                  artifact-name: mopro-bin-macOS
                  adapter: ${{ matrix.adapter }}
                  project-name: mopro-example-${{ matrix.adapter }}
                  destination: ${{ runner.temp }}

            - name: Build iOS (release; device+sim arm64 only)
              working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}
              run: |
                  "$GITHUB_WORKSPACE/bin/mopro" build \
                    --mode release \
                    --platforms ios \
                    --architectures aarch64-apple-ios aarch64-apple-ios-sim

            - name: Clean the `build` dir to save space
              run: rm -rf ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}/build

            - name: Create iOS framework
              working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}
              run: |
                  "$GITHUB_WORKSPACE/bin/mopro" create --framework ios

            - name: Remove build artifacts before packaging
              run: rm -rf ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}/build

            - name: Archive prepared project
              run: |
                  cd ${{ runner.temp }}
                  tar -czf mopro-example-${{ matrix.adapter }}.tar.gz mopro-example-${{ matrix.adapter }}

            - name: Upload prepared project
              uses: actions/upload-artifact@v6
              with:
                  name: ios-project-${{ matrix.adapter }}
                  path: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}.tar.gz
                  if-no-files-found: error

    cli_test_ios_simulator:
        needs: cli_build_ios_prepare
        strategy:
            fail-fast: false
            matrix:
                adapter: [circom, halo2, noir, gnark]
        runs-on: macos-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: ios-project-${{ matrix.adapter }}
                  path: ${{ runner.temp }}

            - name: Extract prepared project
              run: |
                  cd ${{ runner.temp }}
                  tar -xzf mopro-example-${{ matrix.adapter }}.tar.gz

            - name: Xcode test (simulator, arm64 only)
              timeout-minutes: 15
              working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}
              run: |
                  # Capitalize adapter (circom -> Circom, halo2 -> Halo2, noir -> Noir)
                  ADAPTER="${{ matrix.adapter }}"
                  ADAPTER_UPPER="$(tr '[:lower:]' '[:upper:]' <<< ${ADAPTER:0:1})${ADAPTER:1}"

                  echo "Running test test${ADAPTER_UPPER}ProveVerify"

                  xcodebuild \
                    -project ios/MoproApp.xcodeproj \
                    -scheme MoproApp \
                    -configuration Debug \
                    -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=26.2' \
                    -sdk iphonesimulator \
                    -only-testing:MoproAppUITests/MoproAppUITests/test${ADAPTER_UPPER}ProveVerify \
                    ARCHS=arm64 EXCLUDED_ARCHS='x86_64' ONLY_ACTIVE_ARCH=YES \
                    CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
                    -maximum-parallel-testing-workers 1 \
                    -resultBundlePath ${{ runner.temp }}/MoproApp-simulator-test.xcresult \
                    -derivedDataPath ${{ runner.temp }}/DerivedData \
                    test

            - name: Upload Xcode results (failure)
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: ios-xcode-simulator-test-results-${{ matrix.adapter }}
                  path: |
                      ${{ runner.temp }}/MoproApp-simulator-test.xcresult

    cli_build_android:
        needs: cli_build
        strategy:
            fail-fast: false
            matrix:
                adapter: [circom, halo2, noir, gnark]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        steps:
            - uses: actions/checkout@v6

            - name: Setup Go (for gnark adapter)
              if: matrix.adapter == 'gnark'
              uses: actions/setup-go@v5
              with:
                  go-version: "1.24"

            - name: Android SDK
              uses: android-actions/setup-android@v3

            - name: Setup NDK
              uses: nttld/setup-ndk@v1
              with:
                  ndk-version: r26d

            # The barretenberg prebuilt is Zig-built instead of NDK
            # link libc++ with Zig so it resolves.
            - name: Setup Zig (for noir/barretenberg libc++ ABI)
              if: matrix.adapter == 'noir'
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.16.0

            - name: Prepare template project
              uses: ./.github/actions/mopro-init-project
              with:
                  artifact-name: mopro-bin-${{ runner.os }}
                  adapter: ${{ matrix.adapter }}
                  project-name: mopro-example-${{ matrix.adapter }}
                  destination: ${{ runner.temp }}

            - name: Build Android (release, x86_64)
              working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}
              run: |
                  "$GITHUB_WORKSPACE/bin/mopro" build \
                    --mode release \
                    --platforms android \
                    --architectures x86_64-linux-android

            - name: Clean the `build` dir to save space
              run: rm -rf ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}/build

            - name: Create Android framework
              working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}
              run: |
                  "$GITHUB_WORKSPACE/bin/mopro" create --framework android

            - name: Build android app
              working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}
              run: cd android && chmod +x gradlew && ./gradlew build

            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Run tests
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 30
                  target: google_apis
                  arch: x86_64
                  disable-animations: true
                  emulator-options: "-no-snapshot -no-boot-anim -no-window -gpu swiftshader_indirect -memory 2048 -cores 1"
                  script: cd ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}/android && ./gradlew connectedAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.moproapp.ExampleInstrumentedTest#${{ matrix.adapter }}ButtonClick

            - name: Upload test report
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: android-test-report
                  path: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}/android/app/build/reports/androidTests/connected/debug/

    cli_build_flutter:
        needs: cli_build
        strategy:
            fail-fast: false
            matrix:
                adapter: [circom, halo2, noir, gnark]
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        steps:
            - uses: actions/checkout@v6

            - name: Setup Go (for gnark adapter)
              if: matrix.adapter == 'gnark'
              uses: actions/setup-go@v5
              with:
                  go-version: "1.24"

            - uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.35.4"
                  channel: "stable"

            - name: Prepare template project
              uses: ./.github/actions/mopro-init-project
              with:
                  artifact-name: mopro-bin-${{ runner.os }}
                  adapter: ${{ matrix.adapter }}
                  project-name: mopro-example-${{ matrix.adapter }}
                  destination: ${{ runner.temp }}

            - name: Build Flutter (release)
              working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}
              run: |
                  "$GITHUB_WORKSPACE/bin/mopro" build \
                    --mode release \
                    --platforms flutter

            - name: Clean the `build` dir to save space
              run: rm -rf ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}/build

            - name: Create Flutter framework
              working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}
              run: |
                  "$GITHUB_WORKSPACE/bin/mopro" create --framework flutter

            - name: Build flutter app
              working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}
              run: cd flutter && flutter pub get

    cli_create_react_native:
