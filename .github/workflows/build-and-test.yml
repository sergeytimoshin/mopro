            - name: Upload native build outputs (on failure)
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: rn-build-outputs-${{ matrix.adapter }}
                  path: |
                      ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}/react-native/ios/build/**/*.log
                      ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}/react-native/android/app/build/outputs/**
                  if-no-files-found: ignore

    cli_build_web:
        needs:
            - cli_build
            - setup_halo2_wasm_env
        strategy:
            fail-fast: false
            matrix:
                adapter: [halo2, gnark]
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        steps:
            - uses: actions/checkout@v6

            - name: Install Rust target (wasm)
              run: rustup target add wasm32-unknown-unknown

            - name: Restore cached wasm-pack
              uses: actions/cache@v4
              with:
                  path: ~/.cargo/bin/wasm-pack
                  key: ${{ runner.os }}-wasm-pack-env

            - name: Prepare template project
              uses: ./.github/actions/mopro-init-project
              with:
                  artifact-name: mopro-bin-${{ runner.os }}
                  adapter: ${{ matrix.adapter }}
                  project-name: mopro-example-${{ matrix.adapter }}
                  destination: ${{ runner.temp }}

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Setup Go (for gnark web)
              if: matrix.adapter == 'gnark'
              uses: actions/setup-go@v5
              with:
                  go-version: "1.24"
                  cache-dependency-path: cli/src/template/init/gnark-web/go.sum

            - name: Test gnark serialization and invalid inputs
              if: matrix.adapter == 'gnark'
              working-directory: ${{ runner.temp }}/mopro-example-gnark/gnark-web
              env:
                  MOPRO_GNARK_SOLVER_FIXTURES: ${{ runner.temp }}/gnark-solver-fixtures
              run: |
                  go test -count=1 ./...
                  node --test test/runtime.test.mjs

            - name: Test gnark browser arithmetic
              if: matrix.adapter == 'gnark'
              working-directory: ${{ runner.temp }}/mopro-example-gnark/gnark-web
              env:
                  MOPRO_GNARK_SOLVER_FIXTURES: ${{ runner.temp }}/gnark-solver-fixtures
              run: cargo test --manifest-path accelerator/Cargo.toml --workspace --release --locked

            - name: Build Web (release; auto-confirm prompt)
              working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}
              env:
                  CI: "true"
              run: |
                  set -euo pipefail
                  rustup component add rust-src --toolchain nightly-2025-11-15
                  # TODO: allow mopro CLI to run fully non-interactive so we can drop the pseudo-tty workaround below
                  if [[ "$RUNNER_OS" == "macOS" ]]; then
                    printf 'y\n' | script -q /dev/null "$GITHUB_WORKSPACE/bin/mopro" build --mode release --platforms web
                  else
                    printf 'y\n' | script -q -e -c "$GITHUB_WORKSPACE/bin/mopro build --mode release --platforms web" /dev/null
                  fi
                  if [ ! -d MoproWasmBindings ]; then
                    echo "::error::wasm build did not produce MoproWasmBindings/"
                    exit 1
                  fi
            - name: Check gnark npm package contents
              if: matrix.adapter == 'gnark'
              working-directory: ${{ runner.temp }}/mopro-example-gnark/MoproWasmBindings
              run: node ../gnark-web/benchmark/check-package.cjs

            - name: Create Web framework (release)
              working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}
              run: |
                  "$GITHUB_WORKSPACE/bin/mopro" create --framework web

            - name: Install the packed gnark bindings for browser tests
              if: matrix.adapter == 'gnark'
              working-directory: ${{ runner.temp }}/mopro-example-gnark/MoproWasmBindings
              run: node ../gnark-web/benchmark/check-package.cjs ../web/MoproWasmBindings

            - name: Generate gnark browser commitment fixtures
              if: matrix.adapter == 'gnark'
              working-directory: ${{ runner.temp }}/mopro-example-gnark/gnark-web
              run: go run ./cmd/benchmark -rounds 2048 -commitments 2 -commit-all

            - name: Generate gnark browser solver fixtures
              if: matrix.adapter == 'gnark'
              working-directory: ${{ runner.temp }}/mopro-example-gnark/gnark-web
              run: go run ./cmd/benchmark -mimc -rounds 8 -out ../web/assets/gnark-solver

            - name: Generate gnark hint fallback fixtures
              if: matrix.adapter == 'gnark'
              working-directory: ${{ runner.temp }}/mopro-example-gnark/gnark-web
              run: go run ./cmd/benchmark -rounds 1024 -bits -out ../web/assets/gnark-hints

            - name: Cache wasm web
              id: cache-wasm-web
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}/web
                  key: ${{ runner.os }}-${{ matrix.adapter }}-wasm-web-${{ github.sha }}

    setup_halo2_wasm_env:
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        needs: [lint, clippy_check, check_typos]
        outputs:
            chrome-dir: ${{ steps.parsed-chrome-chromedriver-dir.outputs.chrome-dir }}
            chromedriver-dir: ${{ steps.parsed-chrome-chromedriver-dir.outputs.chromedriver-dir }}
        steps:
            - uses: actions/checkout@v6
            - name: Setup Rust
              uses: ./.github/actions/setup-rust
              with:
                  toolchain: nightly-2025-11-15
                  cache-key: wasm-env
            - name: Cache wasm-pack
              id: cache-wasm-pack
              uses: actions/cache@v4
              with:
                  path: ~/.cargo/bin/wasm-pack
                  key: ${{ runner.os }}-wasm-pack-env
            - name: Install wasm-pack
              if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
              run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
            - name: Setup Chrome and ChromeDriver
              uses: browser-actions/setup-chrome@v1
              id: setup-chrome-chromedriver
              with:
                  chrome-version: 130
                  install-chromedriver: true
            - name: Parse Chrome and ChromeDriver Directories
              id: parsed-chrome-chromedriver-dir
              run: |
                  echo "chrome-dir=$(dirname ${{ steps.setup-chrome-chromedriver.outputs.chrome-path }})" >> $GITHUB_OUTPUT
                  echo "chromedriver-dir=$(dirname ${{ steps.setup-chrome-chromedriver.outputs.chromedriver-path }})" >> $GITHUB_OUTPUT
            - name: Cache Chrome and ChromeDriver
              id: cache-chrome-chromedriver
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.parsed-chrome-chromedriver-dir.outputs.chrome-dir }}
                      ${{ steps.parsed-chrome-chromedriver-dir.outputs.chromedriver-dir }}
                  key: ${{ runner.os }}-cache-chrome-chromedriver

    cli_test_halo2_wasm:
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        needs: [setup_halo2_wasm_env]
        env:
            CHROME_BIN: ${{ needs.setup_halo2_wasm_env.outputs.chrome-dir }}/chrome
            CHROMEDRIVER_BIN: ${{ needs.setup_halo2_wasm_env.outputs.chromedriver-dir }}/chromedriver
        steps:
            - uses: actions/checkout@v6
            - name: Restore cached wasm-pack
              uses: actions/cache@v4
              with:
                  path: ~/.cargo/bin/wasm-pack
                  key: ${{ runner.os }}-wasm-pack-env
            - name: Restore cached chrome and chromedriver
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ needs.setup_halo2_wasm_env.outputs.chrome-dir }}
                      ${{ needs.setup_halo2_wasm_env.outputs.chromedriver-dir }}
                  key: ${{ runner.os }}-cache-chrome-chromedriver
            - name: Run wasm halo2 tests
              run: |
                  echo "Override default chrome path for 'wasm-pack test'"
                  sudo ln -sf $CHROME_BIN /opt/google/chrome/chrome
                  echo "Check override chrome version"
                  google-chrome --version
                  cd mopro-ffi
                  wasm-pack test --chrome --chromedriver $CHROMEDRIVER_BIN --headless -- --no-default-features --features wasm
    test_wasm_web:
        runs-on: ubuntu-latest
        needs:
            - setup_halo2_wasm_env
            - cli_build_web
        strategy:
            fail-fast: false
            matrix:
                adapter: [halo2, gnark]
        env:
            CHROME_BIN: ${{ needs.setup_halo2_wasm_env.outputs.chrome-dir }}/chrome
            CHROMEDRIVER_BIN: ${{ needs.setup_halo2_wasm_env.outputs.chromedriver-dir }}/chromedriver
        steps:
            - uses: actions/checkout@v6
            - name: Restore cached chrome and chromedriver
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ needs.setup_halo2_wasm_env.outputs.chrome-dir }}
                      ${{ needs.setup_halo2_wasm_env.outputs.chromedriver-dir }}
                  key: ${{ runner.os }}-cache-chrome-chromedriver
            - name: Cache wasm web
              id: cache-wasm-web
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}/web
                  key: ${{ runner.os }}-${{ matrix.adapter }}-wasm-web-${{ github.sha }}
            - name: Install dependencies
              working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}/web
              run: yarn install
            - name: Run wasm app server and test it
              working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}/web
              run: |
                  echo "This test will be on latest chrome & chromedriver"
                  nohup yarn start &
                  for i in {1..30}; do
                    if curl --silent http://localhost:3000 > /dev/null; then
                      echo "Server is ready!"
                      break
                    fi
                    echo "Waiting for server..."
                    sleep 1
                  done
                  yarn test

            - name: Test threaded gnark proofs and lifecycle
              if: matrix.adapter == 'gnark'
              working-directory: ${{ runner.temp }}/mopro-example-gnark/web
              env:
                  MOPRO_GNARK_MODE: rust
              run: node "$GITHUB_WORKSPACE/cli/src/template/init/gnark-web/benchmark/browser.cjs"

            - name: Test threaded gnark witness solving
              if: matrix.adapter == 'gnark'
              working-directory: ${{ runner.temp }}/mopro-example-gnark/web
              env:
                  MOPRO_GNARK_MODE: rust
                  MOPRO_GNARK_BENCH_BASE: ./assets/gnark-solver/
                  MOPRO_GNARK_BENCH_REPORT: gnark-solver-benchmark.json
              run: node "$GITHUB_WORKSPACE/cli/src/template/init/gnark-web/benchmark/browser.cjs"

            - name: Test Rust arithmetic with Go hint solving
              if: matrix.adapter == 'gnark'
              working-directory: ${{ runner.temp }}/mopro-example-gnark/web
              env:
                  MOPRO_GNARK_MODE: rust
                  MOPRO_GNARK_BENCH_BASE: ./assets/gnark-hints/
                  MOPRO_GNARK_BENCH_REPORT: gnark-hints-benchmark.json
              run: node "$GITHUB_WORKSPACE/cli/src/template/init/gnark-web/benchmark/browser.cjs"

            - name: Test default Go proving
              if: matrix.adapter == 'gnark'
              working-directory: ${{ runner.temp }}/mopro-example-gnark/web
              env:
                  MOPRO_GNARK_MODE: go
                  MOPRO_GNARK_BENCH_BASE: ./assets/gnark-solver/
                  MOPRO_GNARK_BENCH_REPORT: gnark-go-benchmark.json
              run: node "$GITHUB_WORKSPACE/cli/src/template/init/gnark-web/benchmark/browser.cjs"

            - name: Test fallback without isolation headers
              if: matrix.adapter == 'gnark'
              working-directory: ${{ runner.temp }}/mopro-example-gnark/web
              env:
                  MOPRO_GNARK_MODE: portable
                  MOPRO_GNARK_BENCH_URL: http://localhost:3001/gnark-benchmark.html
                  MOPRO_GNARK_BENCH_BASE: ./assets/gnark-solver/
                  MOPRO_GNARK_BENCH_REPORT: gnark-portable-benchmark.json
              run: |
                  python3 -m http.server 3001 > "$RUNNER_TEMP/gnark-portable-server.log" 2>&1 &
                  server_pid=$!
                  trap 'kill "$server_pid"' EXIT
                  for i in {1..30}; do
                    if curl --fail --silent http://localhost:3001/gnark-benchmark.html > /dev/null; then break; fi
                    sleep 1
                  done
                  node "$GITHUB_WORKSPACE/cli/src/template/init/gnark-web/benchmark/browser.cjs"

            - name: Setup Go for independent proof verification
              if: matrix.adapter == 'gnark'
              uses: actions/setup-go@v5
              with:
                  go-version: "1.24"
                  cache-dependency-path: cli/src/template/init/gnark-web/go.sum

            - name: Verify browser proofs with native gnark
              if: matrix.adapter == 'gnark'
              working-directory: cli/src/template/init/gnark-web
              env:
                  MOPRO_GNARK_BENCH_FIXTURES: ${{ runner.temp }}/mopro-example-gnark/web/assets/gnark-bench
                  MOPRO_GNARK_BENCH_REPORT: ${{ runner.temp }}/mopro-example-gnark/web/gnark-benchmark.json
              run: go test -run TestBrowserBenchmarkProofs -v

            - name: Verify browser solver proofs with native gnark
              if: matrix.adapter == 'gnark'
              working-directory: cli/src/template/init/gnark-web
              env:
                  MOPRO_GNARK_BENCH_FIXTURES: ${{ runner.temp }}/mopro-example-gnark/web/assets/gnark-solver
                  MOPRO_GNARK_BENCH_REPORT: ${{ runner.temp }}/mopro-example-gnark/web/gnark-solver-benchmark.json
              run: go test -run TestBrowserBenchmarkProofs -v

            - name: Verify Go, portable and hint proofs with native gnark
              if: matrix.adapter == 'gnark'
              working-directory: cli/src/template/init/gnark-web
              run: |
                  for mode in go portable hints; do
                    fixture=gnark-solver
                    if [ "$mode" = hints ]; then fixture=gnark-hints; fi
                    MOPRO_GNARK_BENCH_FIXTURES="$RUNNER_TEMP/mopro-example-gnark/web/assets/$fixture" \
                    MOPRO_GNARK_BENCH_REPORT="$RUNNER_TEMP/mopro-example-gnark/web/gnark-$mode-benchmark.json" \
                      go test -run TestBrowserBenchmarkProofs -count=1 -v
                  done

            - name: Save gnark browser verification reports
              if: always() && matrix.adapter == 'gnark'
              uses: actions/upload-artifact@v6
              with:
                  name: gnark-browser-reports
                  path: ${{ runner.temp }}/mopro-example-gnark/web/gnark*-benchmark.json
