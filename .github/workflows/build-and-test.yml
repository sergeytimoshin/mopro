            #   run: sleep 20

            # - name: Run iOS Detox tests
            #   working-directory: ${{ runner.temp }}/mopro-example-${{ matrix.adapter }}/react-native
            #   run: npm run e2e:test:ios
            # # ---- Android build (headless) ----
